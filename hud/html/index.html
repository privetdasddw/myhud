<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Orbit HUD</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div id="hud" class="hidden">

  <!-- АДРЕС — двухстрочный layered-блок над radar, левый край по левому
       краю круга. Строка 1: улица (uppercase) + направление в конце.
       Строка 2: пин + postal — тихая подстрочная строка. -->
  <div class="addr surf">
    <div class="addr__row">
      <span class="addr__street" id="street"></span>
      <span class="addr__dir" id="compass"></span>
    </div>
    <div class="addr__row addr__row--sub">
      <span class="ico ico--xs" data-icon="pin"></span>
      <span class="addr__postal" id="postal"></span>
    </div>
  </div>

  <!-- ПРАВАЯ КОЛОНКА — статус-капсула внизу (опорная линия круга),
       автомобильный кластер над ней. Без фона у колонки. -->
  <div class="rail">

    <!-- КЛАСТЕР — только за рулём. Слева герой-скорость + единица под
         ней; справа колонка: знак лимита → активная передача с точками
         позиции PRNDS. Ниже топливо, в футере ремень + радио. -->
    <div class="drive">
      <div class="drive__main surf">
        <div class="drive__top">
          <div class="drive__speed">
            <span class="speed" id="speed">000</span>
            <span class="drive__unit" id="unit"></span>
          </div>
          <div class="drive__side">
            <span class="limit" id="limitwrap">
              <span class="limit__delta" id="delta"></span>
              <span class="limit__sign" id="limitbox"><span id="limit"></span></span>
            </span>
            <span class="gear">
              <i class="gear__dots" id="geardots"><i></i><i></i><i></i><i></i><i></i></i>
              <b class="gear__letter" id="gearletter">D</b>
            </span>
          </div>
        </div>

        <div class="fuel" id="fuelrow">
          <span class="ico ico--xs" data-icon="fuel"></span>
          <span class="fuel__track"><i id="fuelbar"></i></span>
          <span class="fuel__pct" id="fuel"></span>
        </div>

        <div class="drive__foot">
          <span class="belt" id="beltpair"><span class="ico ico--xs" id="belt" data-icon="belt"></span></span>
          <span class="rdo" id="radio"><i class="rdo__dot"></i><span id="radiolabel"></span></span>
        </div>
      </div>
    </div>

    <!-- СТАТУС — время · погода · микрофон в одной капсуле. Иконка и
         значение — плотная пара; пары разведены шире, чем внутри пары. -->
    <div class="status surf">
      <span class="status__group">
        <span class="ico ico--xs" id="dayicon" data-icon="moon"></span>
        <span class="status__val" id="time"></span>
      </span>
      <i class="status__sep"></i>
      <span class="status__group">
        <span class="ico ico--xs" id="wxicon" data-icon="cloud"></span>
        <span class="status__val status__val--sub" id="temp"></span>
      </span>
      <span class="micb" id="micwrap"><span class="ico ico--xs" data-icon="mic"></span></span>
    </div>

  </div>

</div>

<script src="js/icons.js"></script>
<script src="js/state.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
