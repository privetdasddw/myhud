<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Orbit HUD</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div id="hud" class="hidden">

  <!-- АДРЕС — одна строка: postal-чип + улица + направление в конце.
       Левый край по левой кромке круга. Длинная улица режется
       многоточием, postal и direction фиксированы. -->
  <div class="addr surf">
    <span class="addr__postal">
      <span class="ico ico--2xs" data-icon="pin"></span>
      <span id="postal"></span>
    </span>
    <span class="addr__street" id="street"></span>
    <span class="addr__dir" id="compass"></span>
  </div>

  <!-- ПРАВАЯ КОЛОНКА — стек маленьких модулей на нижней касательной
       круга: скорость → топливо → ремень/радио → статус. -->
  <div class="rail">

    <!-- DRIVE — только за рулём. Три отдельных модуля вместо одной
         карточки: герой-скорость, тонкая полоса топлива, aux-стрип. -->
    <div class="drive">
      <div class="spd surf surf--dense">
        <div class="spd__left">
          <span class="speed" id="speed"></span>
          <span class="spd__unit" id="unit"></span>
        </div>
        <i class="spd__div"></i>
        <div class="spd__right">
          <span class="limit" id="limitwrap">
            <span class="limit__delta" id="delta"></span>
            <span class="limit__sign" id="limitbox"><span id="limit"></span></span>
          </span>
          <span class="gears" id="gearstrip"><b data-g="P">P</b><b data-g="R">R</b><b data-g="N">N</b><b data-g="D">D</b><b data-g="S">S</b></span>
        </div>
      </div>

      <div class="fuel surf" id="fuelrow">
        <span class="ico ico--xs" data-icon="fuel"></span>
        <span class="fuel__track"><i id="fuelbar"></i></span>
        <span class="fuel__pct" id="fuel"></span>
      </div>

      <div class="aux surf">
        <span class="belt" id="beltpair"><span class="ico ico--xs" data-icon="belt"></span></span>
        <span class="rdo" id="radio"><i class="rdo__dot"></i><span id="radiolabel"></span></span>
      </div>
    </div>

    <!-- СТАТУС — время · погода · микрофон. Тянется на ширину колонки,
         микрофон прижат к правому краю. -->
    <div class="status surf">
      <span class="status__group">
        <span class="ico ico--xs" id="dayicon" data-icon="moon"></span>
        <span class="status__val" id="time"></span>
      </span>
      <i class="status__sep"></i>
      <span class="status__group">
        <span class="ico ico--xs" id="wxicon" data-icon="cloud"></span>
        <span class="status__val status__val--sub" id="temp"></span>
      </span>
      <span class="micb" id="micwrap"><span class="ico ico--xs" data-icon="mic"></span></span>
    </div>

  </div>

</div>

<script src="js/icons.js"></script>
<script src="js/state.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
</body>
</html>
